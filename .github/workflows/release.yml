name: release

# push a tag like v0.1.0 and this builds the linux binary and the web library and attaches both
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: make test
      - run: make build/seams CC="gcc -static"
      - run: npm ci --prefix wasm && node wasm/build.mjs && node pkg/build.mjs
      - name: pack
        run: |
          mkdir -p out/seams out/seams-web
          cp build/seams README.md out/seams/
          cp tools/seams-git out/seams/ 2>/dev/null || true
          cp -r pkg/dist/. out/seams-web/
          node extension/build.mjs && mkdir -p out/seams-extension && cp -r extension/. out/seams-extension/ && rm -f out/seams-extension/build.mjs
          [ -f LICENSE ] && cp LICENSE out/seams/ && cp LICENSE out/seams-web/
          tar -C out -czf seams-linux-x86_64.tar.gz seams
          tar -C out -czf seams-web.tar.gz seams-web
          (cd out && zip -qr ../seams-extension.zip seams-extension)
      - run: gh release create "$GITHUB_REF_NAME" seams-linux-x86_64.tar.gz seams-web.tar.gz seams-extension.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: release
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - run: choco install nasm -y --no-progress && echo "C:/Program Files/NASM" >> $GITHUB_PATH
      - uses: mlugg/setup-zig@v2
      - run: ZIG=zig bash tools/build-windows.sh
      - name: attach seams.exe
        run: |
          mkdir -p out/seams && cp build/win/seams.exe README.md LICENSE out/seams/
          (cd out && 7z a -tzip ../seams-windows-x86_64.zip seams > /dev/null)
          gh release upload "$GITHUB_REF_NAME" seams-windows-x86_64.zip
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install nasm
      - run: bash tools/build-macos.sh
      - name: attach the mac binary
        run: |
          mkdir -p out/seams && cp build/mac/seams README.md LICENSE out/seams/
          tar -C out -czf seams-macos-x86_64.tar.gz seams
          gh release upload "$GITHUB_REF_NAME" seams-macos-x86_64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
